<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logical Operators Example</title>
</head>

<body>
    <script>
        "use strict";

        // Logical AND (&&)
        let a = true;
        let b = false;
        let andResult = a && b;
        document.getElementById("output1").innerHTML = "The result of true and false is ${andResult}"
    </script>
</body>
</html>
